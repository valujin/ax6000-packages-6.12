name: Monitor and publish 6.12 channels

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the published source lock is unchanged
        required: false
        default: false
        type: boolean

# One full publication at a time, including the source comparison. Failed builds
# leave the last successful Pages deployment and its source lock in place.
concurrency:
  group: package-repository
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heartbeat:
    # Keep repository activity independent of source/build/publication failures.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep scheduled monitoring active after 30 idle days
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import base64
          from datetime import datetime, timedelta, timezone
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          branch = os.environ['DEFAULT_BRANCH']
          repository = os.environ['GITHUB_REPOSITORY']
          path = '.github/monitor-heartbeat.json'
          base = f'https://api.github.com/repos/{repository}'

          def api(endpoint, *, body=None, missing_ok=False):
              request = urllib.request.Request(
                  base + endpoint,
                  data=None if body is None else json.dumps(body).encode(),
                  method='GET' if body is None else 'PUT',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2026-03-10'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read(1024 * 1024 + 1)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise SystemExit(f'Heartbeat API failed (HTTP {error.code}); '
                                   'check Actions contents-write permission and branch rules.')
              if len(data) > 1024 * 1024:
                  raise SystemExit('Heartbeat API response is unexpectedly large')
              return json.loads(data)

          commits_url = '/commits?' + urllib.parse.urlencode({'sha': branch, 'per_page': 1})
          latest = api(commits_url)[0]
          now = datetime.now(timezone.utc)
          committed = datetime.fromisoformat(latest['commit']['committer']['date'].replace('Z', '+00:00'))
          if now - committed < timedelta(days=30):
              print('Repository has a recent branch commit; no heartbeat is needed.')
          else:
              endpoint = '/contents/' + path
              previous = api(endpoint + '?' + urllib.parse.urlencode({'ref': branch}), missing_ok=True)
              if previous is not None:
                  if (previous.get('type') != 'file' or previous.get('path') != path
                          or previous.get('encoding') != 'base64' or previous.get('size', 0) > 4096):
                      raise SystemExit('Refusing unexpected heartbeat path or contents')
                  old = json.loads(base64.b64decode(previous['content']))
                  if old.get('schema_version') != 1 or old.get('kind') != 'monitor-heartbeat':
                      raise SystemExit('Refusing to replace a foreign heartbeat file')
              if api(commits_url)[0]['sha'] != latest['sha']:
                  raise SystemExit('Default branch changed during heartbeat check; retry on the next run')
              content = json.dumps({'schema_version': 1, 'kind': 'monitor-heartbeat',
                                    'observed_commit': latest['sha'],
                                    'updated_at': now.isoformat()}, indent=2) + '\n'
              body = {'message': 'Keep scheduled source monitoring active', 'branch': branch,
                      'content': base64.b64encode(content.encode()).decode()}
              if previous is not None:
                  body['sha'] = previous['sha']
              api(endpoint, body=body)
              print('Committed monitoring heartbeat after at least 30 idle days.')
          PY

  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.profiles.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Monitor both fixed channels and check activation
        id: profiles
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          enabled = False
          for channel in ('recommended', 'latest'):
              generated = Path(f'profiles/redmi-ax6000-612-{channel}.json')
              profile = generated if generated.is_file() else Path(f'profiles/redmi-ax6000-612-{channel}-new.json')
              if not profile.is_file():
                  raise SystemExit(f'Missing explicit 6.12 channel profile: {profile}')
              data = json.loads(profile.read_text())
              if data.get('channel') != channel or data.get('id') != f'redmi-ax6000-612-{channel}':
                  raise SystemExit('Channel/profile identity mismatch')
              active = generated.is_file() and data.get('enabled') is True
              enabled = enabled or active
              subprocess.run(['python3', 'scripts/monitor.py', '--profile', str(profile),
                              '--output', f'state/{channel}-monitored.json'], check=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'- {channel}: ' + ('daily profile active' if active else
                      'publication disabled; verify firmware + exact SDK and initial signed snapshot before activation') + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: monitored-6.12-inputs
          path: state/*-monitored.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: monitor
    if: needs.monitor.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.refresh.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install SDK and trusted signing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake flex bison gawk gettext git libjson-c-dev libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd xz-utils
      - name: Build pinned official host usign
        run: |
          pin=f1f65026a94137c91b5466b149ef3ea3f20091e9
          git init "$RUNNER_TEMP/usign-source"
          git -C "$RUNNER_TEMP/usign-source" fetch --depth 1 https://github.com/openwrt/usign.git "$pin"
          git -C "$RUNNER_TEMP/usign-source" checkout --detach FETCH_HEAD
          [[ $(git -C "$RUNNER_TEMP/usign-source" rev-parse HEAD) == "$pin" ]]
          python3 scripts/hosted-publication.py -- bash scripts/resource-limit.sh --jobs 1 -- cmake \
            -S "$RUNNER_TEMP/usign-source" -B "$RUNNER_TEMP/usign-build"
          python3 scripts/hosted-publication.py -- bash scripts/resource-limit.sh --jobs 1 -- cmake \
            --build "$RUNNER_TEMP/usign-build" --parallel 1
      - name: Refresh serial channel snapshots and compose the complete site
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
          PACKAGE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL }}
          FORCE: ${{ inputs.force || false }}
        run: |
          [[ -n "$OPKG_SIGNING_KEY" ]] || { echo 'Set OPKG_SIGNING_KEY before publication.' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/opkg-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$OPKG_SIGNING_KEY" > "$key"
          unset OPKG_SIGNING_KEY
          site="${PACKAGE_REPOSITORY_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          args=(--site-url "$site" --repository "$GITHUB_REPOSITORY" \
            --profiles profiles --work-root "$RUNNER_TEMP/channel-refresh" --output public \
            --key "$key" --public-key keys/repository.pub --usign "$RUNNER_TEMP/usign-build/usign")
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/hosted-publication.py -- python3 scripts/channel-snapshot.py refresh "${args[@]}"
      - name: Prepare Pages
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload the complete two-channel repository
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Preserve authenticated deployment expectations
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-check
          path: ${{ runner.temp }}/channel-refresh/deployment-check.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deployment-check
          path: deployment-check
      - name: Require the authenticated live predecessor
        run: python3 scripts/channel-snapshot.py verify-deployment --check deployment-check/deployment-check.json --phase before
      - name: Deploy both authenticated channels atomically
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the intended live signed state
        run: python3 scripts/channel-snapshot.py verify-deployment --check deployment-check/deployment-check.json --phase after
