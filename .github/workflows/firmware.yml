name: Build AX6000 6.12 firmware and SDK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Fixed firmware channel; builds stock, mtkuboot and ubootmod together
        required: true
        default: recommended
        type: choice
        options:
          - recommended
          - latest

concurrency:
  group: package-repository
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROFILE: profiles/redmi-ax6000-612-${{ inputs.channel }}-new.json

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.FIRMWARE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require a GitHub hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          echo 'FIRMWARE_RUNNER must name a GitHub hosted runner; self-hosted runners are unsupported.' >&2
          exit 1
      - name: Reclaim disposable hosted runner toolchain storage
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          [[ "$RUNNER_KIND" == github-hosted ]] || exit 1
          # Fixed unused toolchains from the prior successful hosted workflow:
          # valujin/Redmi-ImmortalWrt-padavanonly@d64307364dc50f923f8344795cdeded86a58a4e6
          # .github/workflows/ax6000-stock-padavanonly.yml
          # Current runner-images install-haskell.sh uses /usr/local/.ghcup.
          df -h "$RUNNER_TEMP"
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          if command -v docker >/dev/null; then
            sudo docker image prune --all --force
          fi
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check hosted runner storage
        run: |
          python3 - <<'PY'
          import os
          import shutil

          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          required = 60 * 1024 ** 3
          if free < required:
              raise SystemExit(f'Full firmware, SDK and kernel modules require at least 60 GiB '
                               f'free; this hosted runner has {free / 1024 ** 3:.1f} GiB. '
                               'Use the documented local isolated build command instead.')
          PY
      - name: Run lightweight verification
        run: |
          python3 -m unittest discover -s tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Resolve Tailscale and keep reviewed firmware feed pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/monitor.py --pinned-feeds --profile "$PROFILE" --output state/firmware-lock.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Native source patches are reviewed against these exact feed commits.
          # Moving feeds remain the responsibility of the daily SDK workflow.
          profile = json.loads(Path(os.environ['PROFILE']).read_text())
          path = Path('state/firmware-lock.json')
          lock = json.loads(path.read_text())
          lock['feeds'] = {feed['name']: feed['commit'] for feed in profile['feeds']}
          path.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl zstd xz-utils perl patch libelf-dev swig \
            subversion g++-multilib gcc-multilib ninja-build pkg-config libzstd-dev
      - name: Build pinned independent host APK for native verification
        run: |
          manager=$(python3 -c 'import json,os; print(json.load(open(os.environ["PROFILE"])).get("package_manager", "opkg"))')
          if [[ "$manager" == apk ]]; then
            python3 scripts/hosted-publication.py -- bash scripts/build-apk-host.sh --work-dir "$RUNNER_TEMP/apk-host"
            printf 'AX6000_APK=%s\n' "$RUNNER_TEMP/apk-host/build/src/apk" >> "$GITHUB_ENV"
          fi
      - name: Build firmware, SDK and kernel modules
        id: firmware_build
        run: |
          mkdir -p logs
          python3 scripts/hosted-publication.py -- bash scripts/build-firmware.sh --profile "$PROFILE" --lock state/firmware-lock.json \
            --work-dir "$RUNNER_TEMP/firmware-build" --output-dir raw \
            2>&1 | tee logs/firmware-build.log
      - name: Independently verify native images and matching SDK context
        run: |
          args=(--source "$RUNNER_TEMP/firmware-build/source" --raw raw \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/firmware-verification.json")
          if [[ -n "${AX6000_APK:-}" ]]; then args+=(--apk "$AX6000_APK"); fi
          python3 scripts/hosted-publication.py -- python3 scripts/verify-firmware.py "${args[@]}"
      - name: Upload complete firmware and SDK artifacts
        if: always() && steps.firmware_build.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-firmware-sdk-packages-${{ github.run_id }}
          path: raw
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-build-diagnostics-${{ github.run_id }}
          path: |
            logs
            state/firmware-lock.json
            ${{ runner.temp }}/firmware-verification.json
            ${{ runner.temp }}/apk-host/tool-proof.json
            ${{ runner.temp }}/apk-host/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Record publication prerequisite
        run: |
          echo 'Artifacts only. Validate the exact exported SDK, then use channel-snapshot.py publish-generation and publish-existing.yml to publish both channels atomically.' >> "$GITHUB_STEP_SUMMARY"
