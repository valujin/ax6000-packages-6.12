name: Publish an existing 6.12 firmware generation

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Fixed channel in the immutable firmware generation
        required: true
        default: recommended
        type: choice
        options:
          - recommended
      release_tag:
        description: Exact immutable firmware-BUILD_ID release in this repository
        required: true
        type: string
      replace_build_id:
        description: Exact authenticated live build ID to replace within the same source/kernel ABI/layouts
        required: false
        default: ''
        type: string
      bootstrap:
        description: Allow an absent live site only for the first publication
        required: false
        default: false
        type: boolean

concurrency:
  group: package-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.channel == 'recommended'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bounded import and host signing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd cmake build-essential libjson-c-dev \
            ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev python3 wget curl
      - name: Build pinned official host usign
        run: |
          pin=f1f65026a94137c91b5466b149ef3ea3f20091e9
          git init "$RUNNER_TEMP/usign-source"
          git -C "$RUNNER_TEMP/usign-source" fetch --depth 1 https://github.com/openwrt/usign.git "$pin"
          git -C "$RUNNER_TEMP/usign-source" checkout --detach FETCH_HEAD
          [[ $(git -C "$RUNNER_TEMP/usign-source" rev-parse HEAD) == "$pin" ]]
          python3 scripts/hosted-publication.py -- bash scripts/resource-limit.sh --jobs 1 -- cmake \
            -S "$RUNNER_TEMP/usign-source" -B "$RUNNER_TEMP/usign-build"
          python3 scripts/hosted-publication.py -- bash scripts/resource-limit.sh --jobs 1 -- cmake \
            --build "$RUNNER_TEMP/usign-build" --parallel 1
      - name: Verify immutable generation and import the complete raw build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$CHANNEL" == recommended ]] || { echo 'Only recommended publication is supported.' >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^firmware-[A-Za-z0-9._-]+$ ]] || { echo 'Invalid immutable generation tag.' >&2; exit 1; }
          python3 scripts/channel-snapshot.py fetch-generation --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output release-download \
            --public-key keys/repository.pub --usign "$RUNNER_TEMP/usign-build/usign" --channel "$CHANNEL"
          producer="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("release-download/producer/producer-profile-proof.json").read_text())["producer_commit"])')"
          python3 scripts/import-release.py --archive release-download/raw.tar.zst \
            --checksum release-download/raw.tar.zst.sha256 --output raw \
            --expected-profile release-download/producer/producer-profile.json \
            --expected-producer-commit "$producer"
      - name: Detect imported and retained package managers
        id: managers
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path('raw/profile.json').read_text())
          if (profile.get('channel') != 'recommended'
                  or profile.get('id') != 'redmi-ax6000-612-recommended'
                  or profile.get('package_manager') != 'apk'
                  or profile.get('exclude_asu') is not True or 'asu' in profile):
              raise SystemExit('Only a genuine recommended APK generation without ASU may be published')
          incoming = 'apk'
          needs_apk = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'incoming={incoming}\n')
              output.write(f'apk={str(needs_apk).lower()}\n')
          PYCODE
      - name: Build pinned independent host APK
        if: steps.managers.outputs.apk == 'true'
        run: |
          python3 scripts/hosted-publication.py -- bash scripts/build-apk-host.sh --work-dir "$RUNNER_TEMP/apk-host"
          printf 'AX6000_APK=%s\n' "$RUNNER_TEMP/apk-host/build/src/apk" >> "$GITHUB_ENV"
      - name: Publish a signed durable recommended snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          NEEDS_APK: ${{ steps.managers.outputs.apk }}
          INCOMING_MANAGER: ${{ steps.managers.outputs.incoming }}
          PACKAGE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          REPLACE_BUILD_ID: ${{ inputs.replace_build_id }}
        run: |
          [[ "$INCOMING_MANAGER" == apk && "$NEEDS_APK" == true ]] || { echo 'Only recommended APK publication is supported.' >&2; exit 1; }
          [[ -n "$OPKG_SIGNING_KEY" ]] || { echo 'Set OPKG_SIGNING_KEY before publication.' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/opkg-signing.key"
          apk_key="$RUNNER_TEMP/apk-signing.pem"
          trap 'rm -f "$key" "$apk_key"' EXIT
          printf '%s\n' "$OPKG_SIGNING_KEY" > "$key"
          unset OPKG_SIGNING_KEY
          site="${PACKAGE_REPOSITORY_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          args=(--raw raw --external-assets release-download/downloads.json \
            --external-assets-signature release-download/downloads.sig \
            --generation-release-metadata release-download/release.json \
            --site-url "$site" --repository "$GITHUB_REPOSITORY" --profiles profiles \
            --work-root "$RUNNER_TEMP/channel-publication" --output public --key "$key" \
            --public-key keys/repository.pub --usign "$RUNNER_TEMP/usign-build/usign")
          if [[ "$NEEDS_APK" == true ]]; then
            [[ -x "${AX6000_APK:-}" ]] || { echo 'Trusted APK tool is required.' >&2; exit 1; }
            args+=(--apk "$AX6000_APK")
          fi
          if [[ "$INCOMING_MANAGER" == apk ]]; then
            [[ -n "$APK_SIGNING_KEY" && -f keys/repository-apk.pem ]] || { echo 'Set APK_SIGNING_KEY and pin its public key before APK publication.' >&2; exit 1; }
            printf '%s\n' "$APK_SIGNING_KEY" > "$apk_key"
            args+=(--apk-key "$apk_key" --apk-public-key keys/repository-apk.pem)
          fi
          unset APK_SIGNING_KEY
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          if [[ -n "$REPLACE_BUILD_ID" ]]; then args+=(--replace-build-id "$REPLACE_BUILD_ID"); fi
          python3 scripts/hosted-publication.py -- python3 scripts/channel-snapshot.py publish-channel "${args[@]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-check
          path: ${{ runner.temp }}/channel-publication/deployment-check.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deployment-check
          path: deployment-check
      - name: Require the authenticated live predecessor
        run: python3 scripts/channel-snapshot.py verify-deployment --check deployment-check/deployment-check.json --phase before
      - name: Deploy the signed recommended repository
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the intended live signed state
        run: python3 scripts/channel-snapshot.py verify-deployment --check deployment-check/deployment-check.json --phase after
